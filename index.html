<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Reminder - Dark Mode</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #06121f;
      --bg-soft: #0d1d2d;
      --panel: #101f31;
      --panel-2: #162c41;
      --card: #12263b;
      --card-strong: #17314c;
      --primary: #60a5fa;
      --secondary: #7dd3fc;
      --text: #e8f1ff;
      --muted: #9fb5ca;
      --accent: #38bdf8;
      --line: rgba(125, 211, 252, 0.18);
      --success: #22c55e;
      --warning: #fbbf24;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: radial-gradient(circle at top, #0e2337 0%, var(--bg) 42%, #040d16 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
      min-height: 100vh;
    }

    .soft-shadow {
      box-shadow: 0 12px 28px rgba(4, 16, 28, 0.5);
    }

    .glass-panel {
      background: linear-gradient(180deg, rgba(19, 35, 52, 0.96), rgba(13, 27, 39, 0.96));
      border: 1px solid var(--line);
    }

    .progress-pill {
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.15), rgba(125, 211, 252, 0.08));
      border: 1px solid rgba(125, 211, 252, 0.2);
    }

    .level-card {
      animation: riseIn 0.5s ease-out forwards;
    }

    .mono-symbol {
      font-variant-emoji: text;
      color: currentColor;
    }

    @keyframes riseIn {
      0% { transform: translateY(12px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 640px) {
      .page-shell {
        padding-top: 24px;
      }

      .mobile-title {
        font-size: 2.1rem;
        line-height: 1.1;
      }

      .task-form-row {
        display: flex;
        flex-direction: column;
      }

      .task-form-row > * {
        width: 100%;
      }

      .progress-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .task-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .task-card .task-main {
        width: 100%;
      }

      .task-delete {
        align-self: flex-end;
        margin-top: -8px;
      }

      #gardenContainer {
        min-height: 120px;
      }
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Main Container -->
  <div class="page-shell max-w-5xl mx-auto px-3 sm:px-4 pt-8 sm:pt-10">
    
    <!-- Header & Encouragement -->
    <div class="mb-10 text-center">
      <h1 class="mobile-title text-3xl sm:text-4xl font-bold text-[#7dd3fc] mb-4 flex justify-center items-center gap-3">
        <i data-lucide="rocket" class="text-[#60a5fa]"></i>
        Task Reminder
        <i data-lucide="rocket" class="text-[#60a5fa]"></i>
      </h1>
      <div id="encouragementText" class="glass-panel text-[#dfeeff] py-4 px-6 rounded-3xl soft-shadow font-semibold text-lg inline-block transition-all duration-300 border border-[#1d3557]">
        Gas pagi, level kamu siap naik. Satu target dulu, lalu lanjut. <span class="mono-symbol">⚡︎</span>
      </div>
    </div>

    <!-- Input Section -->
    <div class="glass-panel p-6 rounded-[32px] soft-shadow mb-8">
      <form id="taskForm" class="flex flex-col gap-4">
        
        <div class="relative">
          <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
            <i data-lucide="book-open" class="text-[#7dd3fc]" style="width: 20px; height: 20px;"></i>
          </div>
          <select 
            id="subjectInput"
            class="w-full bg-[#0d1d2d] text-[#e8f1ff] pl-12 pr-4 py-4 rounded-3xl appearance-none focus:outline-none focus:ring-4 focus:ring-[#1d4ed8] transition-all cursor-pointer font-semibold border border-[#1d3557]"
            required
          >
            <option value="" disabled selected>Pilih Mata Kuliah...</option>
            <!-- Subjects will be populated via JS -->
          </select>
        </div>

        <div class="task-form-row flex flex-col sm:flex-row gap-4">
          <input 
            type="text" 
            id="taskInput"
            placeholder="Apa target yang mau kamu selesaikan?"
            class="flex-[2] bg-[#0d1d2d] text-[#e8f1ff] pl-6 pr-4 py-4 rounded-3xl focus:outline-none focus:ring-4 focus:ring-[#1d4ed8] transition-all font-medium placeholder-[#8aa4bf] border border-[#1d3557]"
            required
          />
          <div class="relative flex-1">
             <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                <i data-lucide="calendar" class="text-[#7dd3fc]" style="width: 18px; height: 18px;"></i>
             </div>
             <input 
               type="date" 
               id="deadlineInput"
               class="w-full bg-[#0d1d2d] text-[#e8f1ff] pl-10 pr-4 py-4 rounded-3xl focus:outline-none focus:ring-4 focus:ring-[#1d4ed8] transition-all font-medium border border-[#1d3557]"
             />
          </div>
          <button 
            type="submit"
            class="bg-gradient-to-r from-[#3b82f6] to-[#38bdf8] hover:from-[#2563eb] hover:to-[#0ea5e9] text-white font-bold py-4 px-8 rounded-3xl flex justify-center items-center gap-2 transition-transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-[#1d4ed8]/30"
          >
            <i data-lucide="plus" style="width: 20px; height: 20px;"></i>
            Tambah
          </button>
        </div>
      </form>
    </div>

    <!-- Task List Section -->
    <div class="mb-10">
      <h2 class="text-2xl font-bold text-[#7dd3fc] mb-4 px-2">Daftar target hari ini</h2>
      <div id="taskListContainer" class="space-y-3">
        <!-- Tasks will be injected here -->
      </div>
    </div>

    <!-- Progress Section -->
    <div id="progressSection" class="glass-panel p-6 rounded-[32px] soft-shadow hidden">
      <div class="progress-header flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-[#7dd3fc] flex items-center gap-2">
          <i data-lucide="bar-chart-3"></i> Progress hari ini
        </h2>
        <span id="gardenCount" class="progress-pill text-[#dfeeff] px-4 py-1 rounded-full font-bold text-sm">
          0/0 selesai
        </span>
      </div>
      
      <div id="gardenContainer" class="bg-[#0a1a2a] rounded-3xl p-6 min-h-[160px] flex flex-wrap gap-4 items-start justify-start border border-[#1d3557]">
        <!-- progress items will be injected here -->
      </div>
      <p class="text-center text-sm font-medium text-[#9fb5ca] mt-4 opacity-90">
        Satu tugas selesai = satu step lebih dekat ke tujuan besar.
      </p>
    </div>

  </div>

  <script>
    // --- DATA & STATE ---
    const subjects = [
      'Sosiologi Perdesaan',
      'Penulisan Karya Ilmiah dan Publikasi',
      'Analisis dan Perancangan Sistem Informasi',
      'Struktur Data dan Algoritma',
      'Sistem Operasi dan Infrastruktur TI',
      'Pemrograman Berorientasi Objek',
      'Sistem Pendukung Keputusan'
    ];

    const encouragements = {
      add: [
        "Gas, satu target baru masuk list. Fokus dulu, hasilnya ikut nyusul.",
        "Jangan ngeremehin langkah kecil. Satu set selesai, level naik.",
        "Ambil target ini dulu. Kelas akan mulai saat kamu bergerak."
      ],
      complete: [
        "Mantap, satu tugas selesai. Level kamu naik. ✓",
        "Wih, progres makin solid. Keep pushing, bukan nyerah. ✓",
        "Selesai juga. Ini yang bikin hari ini makin worth it. ✓",
        "Kamu lagi di ritme yang bener. Lanjutkan, jangan stop. ✓"
      ]
    };

    let tasks = [];

    // --- DOM ELEMENTS ---
    const subjectSelect = document.getElementById('subjectInput');
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const deadlineInput = document.getElementById('deadlineInput');
    const taskListContainer = document.getElementById('taskListContainer');
    const gardenContainer = document.getElementById('gardenContainer');
    const gardenCount = document.getElementById('gardenCount');
    const progressSection = document.getElementById('progressSection');
    const encouragementText = document.getElementById('encouragementText');
    // --- INITIALIZATION ---
    function init() {
      // Populate subjects
      subjects.forEach(sub => {
        const option = document.createElement('option');
        option.value = sub;
        option.textContent = sub;
        subjectSelect.appendChild(option);
      });

      // Load data from localStorage
      const savedTasks = localStorage.getItem('azkaTasksVanilla');
      if (savedTasks) {
        const parsedTasks = JSON.parse(savedTasks);
        tasks = parsedTasks.filter(task => ![101, 102, 103].includes(task.id));
      }

      render();
      lucide.createIcons(); // Initialize icons
    }

    // --- RENDER LOGIC (The Vanilla JS alternative to React's Virtual DOM) ---
    function render() {
      renderTasks();
      renderGarden();
      saveData();
      lucide.createIcons(); // Re-initialize icons for newly added DOM elements
    }

    function renderTasks() {
      taskListContainer.innerHTML = '';
      const pendingTasks = tasks.filter(t => !t.completed);

      if (pendingTasks.length === 0) {
        const emptyStateMessage = tasks.length === 0
          ? 'Belum ada target. Tambahkan tugas pertama dan mulai bangun momentum.'
          : 'Semua target udah clear. <br/>Sekarang tinggal eksekusi level berikutnya.';
        taskListContainer.innerHTML = `
          <div class="bg-[#0d1d2d] border-2 border-dashed border-[#1d3557] rounded-[32px] p-8 text-center text-[#9fb5ca]">
            <i data-lucide="check-circle-2" style="width: 32px; height: 32px;" class="mx-auto mb-3 opacity-80 text-[#7dd3fc]"></i>
            <p class="font-semibold text-[#dfeeff]">${emptyStateMessage}</p>
          </div>
        `;
        return;
      }

      pendingTasks.forEach(task => {
        const deadlineHtml = task.deadline ? `
          <span class="text-xs font-semibold text-[#cfe8ff] bg-[#12263b] px-2 py-1 rounded-xl flex items-center gap-1 w-max border border-[#1d3557]">
            <i data-lucide="calendar" style="width: 12px; height: 12px;"></i> ${formatDateFriendly(task.deadline)}
          </span>
        ` : '';

        const taskEl = document.createElement('div');
        taskEl.className = "task-card bg-[#0d1d2d] p-5 rounded-3xl flex items-center justify-between gap-4 soft-shadow group hover:bg-[#11273b] transition-colors border border-[#1d3557]";
        taskEl.innerHTML = `
          <div class="task-main flex items-center gap-4 flex-1">
            <button onclick="toggleComplete(${task.id})" class="w-8 h-8 rounded-full border-2 border-[#60a5fa] hover:bg-[#60a5fa] hover:text-[#081724] flex items-center justify-center transition-all flex-shrink-0 text-[#7dd3fc] hover:text-[#081724]">
              <i data-lucide="check" style="width: 16px; height: 16px; stroke-width: 3;"></i>
            </button>
            <div>
              <div class="flex flex-wrap items-center gap-2 mb-1">
                <span class="text-xs font-bold text-[#dfeeff] bg-[#12263b] px-2 py-1 rounded-xl block w-max border border-[#1d3557]">
                  ${task.subject}
                </span>
                ${deadlineHtml}
              </div>
              <p class="font-semibold text-lg text-[#edf6ff]">${task.text}</p>
            </div>
          </div>
          <button onclick="deleteTask(${task.id})" class="task-delete text-[#fca5a5] hover:text-[#f87171] hover:bg-[#1f2937] p-2 rounded-full transition-all opacity-0 group-hover:opacity-100 focus:opacity-100" aria-label="Hapus tugas">
            <i data-lucide="trash-2" style="width: 20px; height: 20px;"></i>
          </button>
        `;
        taskListContainer.appendChild(taskEl);
      });
    }

    function renderGarden() {
      gardenContainer.innerHTML = '';
      const completedTasks = tasks.filter(t => t.completed);
      const totalTasks = tasks.length;

      progressSection.classList.toggle('hidden', completedTasks.length === 0);
      
      gardenCount.textContent = `${completedTasks.length}/${totalTasks} selesai`;

      if (completedTasks.length === 0) {
        return;
      }

      completedTasks.forEach((task, index) => {
        const progressEl = document.createElement('div');
        progressEl.className = "level-card flex items-center gap-3 rounded-2xl border border-[#1d3557] bg-[#12263b] px-4 py-3 min-w-[180px]";
        progressEl.style.animationDelay = `${(index % 10) * 0.08}s`;
        progressEl.innerHTML = `
          <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-[#0d1d2d] border border-[#1d3557] text-[#7dd3fc]">
            <i data-lucide="check" style="width: 18px; height: 18px; stroke-width: 3;"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[10px] uppercase tracking-[0.18em] text-[#8aa4bf] mb-1">Done</p>
            <p class="font-semibold text-[#edf6ff] truncate max-w-[200px]">${task.subject}</p>
          </div>
        `;
        gardenContainer.appendChild(progressEl);
      });
    }

    // --- ACTIONS & HANDLERS ---
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const text = taskInput.value.trim();
      const subject = subjectSelect.value;
      const deadline = deadlineInput.value;

      if (!text || !subject) return;

      const newTask = {
        id: Date.now(),
        text: text,
        subject: subject,
        completed: false,
        deadline: deadline,
        createdAt: new Date().toISOString()
      };

      tasks.unshift(newTask); // Add to beginning
      
      // Reset form
      taskInput.value = '';
      deadlineInput.value = '';
      subjectSelect.selectedIndex = 0;
      
      setEncouragement(encouragements.add[Math.floor(Math.random() * encouragements.add.length)]);
      render();
    });

    window.toggleComplete = function(id) {
      const taskIndex = tasks.findIndex(t => t.id === id);
      if (taskIndex > -1) {
        const task = tasks[taskIndex];
        if (!task.completed) {
          setEncouragement(encouragements.complete[Math.floor(Math.random() * encouragements.complete.length)]);
          task.completed = true;
        } else {
          task.completed = false; // Allow unchecking
        }
        
        checkAllCompleted();
        render();
      }
    };

    window.deleteTask = function(id) {
      tasks = tasks.filter(t => t.id !== id);
      render();
    };

    // --- HELPERS & EFFECTS ---
    function setEncouragement(text) {
      encouragementText.style.opacity = 0;
      setTimeout(() => {
        encouragementText.textContent = text;
        encouragementText.style.opacity = 1;
      }, 300);
    }

    function checkAllCompleted() {
      if (tasks.filter(t => !t.completed).length === 0 && tasks.length > 0) {
        setEncouragement("Semua target selesai. Kamu lagi di mode paling siap dan paling fokus. ✓");
      }
    }

    function formatDateFriendly(dateString) {
      if (!dateString) return '';
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      return new Date(dateString).toLocaleDateString('id-ID', options);
    }

    function saveData() {
      localStorage.setItem('azkaTasksVanilla', JSON.stringify(tasks));
    }

    // Start App
    init();

  </script>
</body>
</html>
