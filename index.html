<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Reminder</title>
  <link rel="icon" type="image/png" href="./Image/favicon.png">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css">
</head>
<body class="min-h-screen pb-12">

  <!-- Main Container -->
  <div class="page-shell max-w-5xl mx-auto px-3 sm:px-4 pt-8 sm:pt-10">
    
    <!-- Header & Encouragement -->
    <div class="mb-10 text-center">
      <h1 class="mobile-title text-3xl sm:text-4xl font-bold text-[#7dd3fc] mb-4 flex justify-center items-center gap-3">
        <i data-lucide="network" class="text-[#e87956]"></i>
        Task Reminder
        <i data-lucide="network" class="text-[#e87956]"></i>
      </h1>
      <div class="program-badge">
        <i data-lucide="database" style="width: 15px; height: 15px;"></i>
        SISTEM INFORMASI · STUDENT TASK HUB
      </div>
      <div id="encouragementText" class="glass-panel text-[#dfeeff] py-4 px-6 rounded-3xl soft-shadow font-semibold text-lg inline-block transition-all duration-300 border border-[#1d3557]">
        Gas pagi, level kamu siap naik. Satu target dulu, lalu lanjut. <span class="mono-symbol">⚡︎</span>
      </div>
    </div>

    <!-- Input Section -->
    <div class="glass-panel p-6 rounded-[32px] soft-shadow mb-8">
      <form id="taskForm" class="flex flex-col gap-4">
        
        <div class="subject-field relative">
          <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
            <i data-lucide="book-open" class="text-[#7dd3fc]" style="width: 20px; height: 20px;"></i>
          </div>
          <select 
            id="subjectInput"
            class="task-select w-full bg-[#0d1d2d] text-[#e8f1ff] pl-12 pr-4 py-4 rounded-3xl appearance-none focus:outline-none focus:ring-4 focus:ring-[#1d4ed8] transition-all cursor-pointer font-semibold border border-[#1d3557]"
            required
          >
            <option value="" disabled selected>Pilih Mata Kuliah...</option>
            <!-- Subjects will be populated via JS -->
          </select>
        </div>

        <div class="task-form-row flex flex-col sm:flex-row gap-4">
          <input 
            type="text" 
            id="taskInput"
            placeholder="Apa target yang mau kamu selesaikan?"
            class="task-input target-field flex-[2] bg-[#0d1d2d] text-[#e8f1ff] pl-6 pr-4 py-4 rounded-3xl focus:outline-none focus:ring-4 focus:ring-[#1d4ed8] transition-all font-medium placeholder-[#8aa4bf] border border-[#1d3557]"
            required
          />
          <div class="date-field relative flex-1">
             <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                <i data-lucide="calendar" class="text-[#7dd3fc]" style="width: 18px; height: 18px;"></i>
             </div>
             <input 
               type="date" 
               id="deadlineInput"
               class="task-input w-full bg-[#0d1d2d] text-[#e8f1ff] pl-10 pr-4 py-4 rounded-3xl focus:outline-none focus:ring-4 focus:ring-[#1d4ed8] transition-all font-medium border border-[#1d3557]"
             />
          </div>
          <button 
            type="submit"
            class="add-task-button bg-gradient-to-r from-[#3b82f6] to-[#38bdf8] hover:from-[#2563eb] hover:to-[#0ea5e9] text-white font-bold py-4 px-8 rounded-3xl flex justify-center items-center gap-2 transition-transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-[#1d4ed8]/30"
          >
            <i data-lucide="plus" style="width: 20px; height: 20px;"></i>
            Tambah
          </button>
        </div>
      </form>
    </div>

    <!-- Task List Section -->
    <div class="mb-10">
      <h2 class="text-2xl font-bold text-[#7dd3fc] mb-4 px-2">Daftar target hari ini</h2>
      <div id="taskListContainer" class="space-y-3">
        <!-- Tasks will be injected here -->
      </div>
    </div>

    <!-- Progress Section -->
    <div id="progressSection" class="glass-panel p-6 rounded-[32px] soft-shadow hidden">
      <div class="progress-header flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-[#7dd3fc] flex items-center gap-2">
          <i data-lucide="bar-chart-3"></i> Progress hari ini
        </h2>
        <span id="gardenCount" class="progress-pill text-[#dfeeff] px-4 py-1 rounded-full font-bold text-sm">
          0/0 selesai
        </span>
      </div>
      
      <div id="gardenContainer" class="bg-[#0a1a2a] rounded-3xl p-6 min-h-[160px] flex flex-wrap gap-4 items-start justify-start border border-[#1d3557]">
        <!-- progress items will be injected here -->
      </div>
      <p class="text-center text-sm font-medium text-[#9fb5ca] mt-4 opacity-90">
        Satu tugas selesai = satu step lebih dekat ke tujuan besar.
      </p>
    </div>

  </div>

  <script src="./script.js"></script>
</body>
</html>
